services:
  yt-db-test:
    image: postgres:16.2-alpine3.19
    container_name: yt-db-test
    environment:
      POSTGRES_USER: ytdiff
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: vidlist
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ytdiff -d vidlist" ]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey-test:
    image: valkey/valkey:8.1.6-alpine
    container_name: valkey-test
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-tube:
    image: nginx:alpine
    container_name: mock-tube
    volumes:
      - ./mock-tube/public:/usr/share/nginx/html:ro
      - ./mock-tube/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./mock-tube/ssl:/etc/nginx/ssl:ro
    # Not published to the host: yt-diff-test reaches this over the compose
    # network as https://mock-tube/, and binding 8080 collides with whatever
    # else is already running on the machine.
    # ports:
    #   - "8080:80"
    #   - "8443:443"
    expose:
      - 80
      - 443
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  yt-diff-test:
    # Build from source by default to test latest local changes.
    # You can override this to use a pre-built image by setting YT_DIFF_IMAGE.
    image: yt-diff:stabilization-final-v1
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - VITE_BASE_PATH=/ytdiff
    container_name: yt-diff-test
    depends_on:
      yt-db-test:
        condition: service_healthy
      valkey-test:
        condition: service_healthy
    environment:
      - PROTOCOL=http
      - HOSTNAME=localhost
      - PORT=8888
      - BASE_URL=/ytdiff
      - DB_HOST=yt-db-test
      - DB_USERNAME=ytdiff
      - DB_PASSWORD=testpassword
      - REDIS_HOST=valkey-test
      - REDIS_PORT=6379
      - SECRET_KEY=testsecretkey
      - SAVE_PATH=/app/downloads
      - ALLOW_REGISTRATION=true
      - LOG_LEVELS=trace
      - NO_COLOR=true
      - CLEANUP_INTERVAL=* * * * *
      - PRUNE_INTERVAL=*/15 * * * * *
      - UPDATE_SCHEDULED=* * * * *
      - CACHE_MAX_AGE=600 # 10 min to test the refresh file, don't set less than 5 mins as then the front-end will loop refresh the file
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - DENO_CERT=/etc/ssl/certs/ca-certificates.crt
    tmpfs:
      - /app/downloads:mode=1777
    volumes:
      - ./mock-tube/ssl/combined-ca.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./mock-tube/ssl/combined-ca.crt:/opt/venv/lib/python3.13/site-packages/certifi/cacert.pem:ro
    # ports:
    #   - "8888:8888"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/ytdiff/ping" ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-diff-test-runner
    user: "1000:1000"
    depends_on:
      yt-diff-test:
        condition: service_healthy
      mock-tube:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://yt-diff-test:8888/ytdiff
      - REPORTS_DIR=/app/reports
    volumes:
      - ./reports:/app/reports
