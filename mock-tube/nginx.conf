events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen       80;
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  mock-tube;

        ssl_certificate      /etc/nginx/ssl/server.crt;
        ssl_certificate_key  /etc/nginx/ssl/server.key;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            autoindex on;
        }
    }
}
