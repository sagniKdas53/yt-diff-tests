events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    # limit_rate is a sendfile-filter rate, so this has to be on for the cap
    # below to apply to a static file rather than only to proxied responses.
    sendfile      on;

    server {
        listen       80;
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  mock-tube;

        ssl_certificate      /etc/nginx/ssl/server.crt;
        ssl_certificate_key  /etc/nginx/ssl/server.key;

        # Deliberately throttled. Every other fixture is 2 KB and arrives in
        # milliseconds, which answers "did this land" and cannot answer "is
        # this still running when I ask". Job-control tests need a transfer
        # that is provably in flight: at 100 KB/s a 2 MB file takes about
        # twenty seconds, which is an eternity beside a poll.
        location /slow/ {
            limit_rate 100k;
            root   /usr/share/nginx/html;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            autoindex on;
        }
    }
}